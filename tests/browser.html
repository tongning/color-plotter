<!doctype html>
<meta charset="utf-8">
<title>Color plotter browser checks</title>
<style>body{margin:0}iframe{width:100%;height:1100px;border:0}pre{white-space:pre-wrap;padding:16px;background:#eff8ef}</style>
<pre id="results">Running…</pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const output = document.querySelector('#results');
const results = [];
if (new URLSearchParams(location.search).has('preview')) { output.style.display = 'none'; document.querySelector('#app').style.height = '1400px'; }
function check(condition, message) { if (!condition) throw new Error(message); results.push('PASS ' + message); }
document.querySelector('#app').onload = async ({ target }) => {
  const w = target.contentWindow;
  const evaluate = (code) => w.eval(code);
  const svg = (body, attributes = '') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ${attributes}>${body}</svg>`;
  const convert = (text) => w.PlotterColor.importSvg(text, w.svgFillStrokes);
  try {
    check(w.document.querySelectorAll('.marker-select').length === 8, 'Eight marker controls initialize');
    check(w.PlotterColor.nearestTool('#ee3030', w.PlotterColor.DEFAULT_PALETTE) === 1, 'Near-red maps to red marker');
    let paths = await convert(svg('<g transform="translate(10 20) scale(.5)" fill="none" stroke="red"><path d="M0 0 L100 100"/></g>'));
    check(paths.length === 1 && paths[0].color === '#ff0000', 'Inherited SVG stroke color is retained');
    check(Math.abs(paths[0][0].x - .1) < .001 && Math.abs(paths[0][0].y - .2) < .001 && Math.abs(paths[0].at(-1).x - .6) < .001, 'Nested SVG transforms preserve position');
    paths = await convert(svg('<path fill="none" stroke="blue" d="M0 0L10 0 m40 50 l10 0"/>'));
    check(paths.length === 2 && paths[1][0].x === .5, 'Relative compound subpaths stay separate');
    paths = await convert(svg('<path fill="red" fill-rule="evenodd" d="M0 0H100V100H0Z M25 25H75V75H25Z"/>'));
    check(paths.length > 0 && paths.every(p => p.color === '#ff0000'), 'Solid fills create colored hatch paths');
    // The hole edge allows a 0.002 inset (~1px in the 480 raster): the
    // raster fill deliberately overlaps its edge by up to ~0.7px (the
    // skin overlap that joins the fill to its outline), so a point can
    // sit just inside the hole's nominal edge without the hole being
    // hatched. The outline drawn over it covers the overlap.
    check(paths.every(path => path.slice(1).every((b, i) => {
      const a = path[i], steps = Math.max(1, Math.ceil(Math.hypot(b.x-a.x, b.y-a.y)*960));
      for (let j = 0; j <= steps; j++) {
        const x = a.x+(b.x-a.x)*j/steps, y = a.y+(b.y-a.y)*j/steps;
        if (x > .252 && x < .748 && y > .252 && y < .748) return false;
      }
      return true;
    })), 'Even-odd fill holes remain empty along every hatch and connector');
    // A 1-unit bar is 4.8px in the 480 raster, wide enough for two hatch
    // lines, so it is a filled area now (hatch + perimeter), not a traced
    // ink line: 2 paths. Both stay on the bar apart from the fill's skin
    // overlap (~0.002) past its edges.
    paths = await convert(svg('<path fill="red" d="M10 10H11V90H10Z"/>'));
    check(paths.length === 2 && paths.every(p => p.length > 1), 'Thin fill-only SVG artwork imports instead of being discarded');
    check(paths.every(p => p.every(pt => pt.x >= .097 && pt.x <= .113)), 'Thin fill routing stays inside the shape');
    paths = await convert('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480"><path fill="black" fill-rule="evenodd" d="M50 50H250V250H50Z M53 53H247V247H53Z"/></svg>');
    check(paths.length === 1 && paths[0].length < 20, 'Traced filled outlines become one compact centerline loop');
    const outlineLength = paths[0].slice(1).reduce((sum,p,i) => sum + Math.hypot(p.x-paths[0][i].x,p.y-paths[0][i].y)*480,0);
    check(outlineLength > 740 && outlineLength < 830, 'Traced outline is drawn once without hatch oscillations or duplicated contours');
    paths = await convert(svg('<rect x="10" y="10" width="20" height="20" fill="red"/><rect x="70" y="70" width="20" height="20" fill="blue"/>'));
    check(paths.filter(p => p.color === '#ff0000').length >= 2 && paths.filter(p => p.color === '#0000ff').length >= 2 && paths.every(p => p.shape), 'Separate colored fill regions import as hatch plus perimeter');
    // A solid fill's perimeter: one path whose every point lies on the
    // rectangle's edges and which visits all four corners. Hatch paths
    // run through the interior, so they fail the every-point-on-edge test.
    const nearPt = (p, x, y) => Math.abs(p.x - x) < 0.005 && Math.abs(p.y - y) < 0.005;
    const onRectEdge = (p) => [Math.abs(p.x - .1), Math.abs(p.x - .3), Math.abs(p.y - .1), Math.abs(p.y - .3)].some(d => d < 0.002);
    const isPerimeter = (p) => p.length > 4 && p.every(onRectEdge) && [[.1,.1],[.3,.1],[.3,.3],[.1,.3]].every(([x, y]) => p.some(pt => nearPt(pt, x, y)));
    paths = await convert(svg('<rect x="10" y="10" width="20" height="20" fill="red"/>'));
    check(paths.some(p => p.color === '#ff0000' && isPerimeter(p)), 'A solid fill draws its outer perimeter in the fill colour');
    paths = await convert(svg('<rect x="10" y="10" width="20" height="20" fill="red" stroke="blue"/>'));
    check(paths.some(p => p.color === '#0000ff'), 'A stroked fill still draws its stroke perimeter');
    check(!paths.some(p => p.color === '#ff0000' && isPerimeter(p)), 'A stroked fill does not add a second fill-coloured perimeter');
    paths = await convert(svg('<style>.ink{stroke:#00a7b5;fill:none}</style><circle class="ink" cx="50" cy="50" r="20"/><g display="none"><path stroke="red" d="M0 0L50 50"/></g>'));
    check(paths.length === 1 && paths[0].color === '#00a7b5', 'CSS colors work and hidden shapes are skipped');
    paths = await convert('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><path stroke="red" d="M0 0L200 100" fill="none"/></svg>');
    check(Math.abs(paths[0][0].y-.25)<.001 && Math.abs(paths[0].at(-1).y-.75)<.001, 'SVG without viewBox fits and centers with its aspect ratio');
    paths = await convert(svg('<path fill="none" stroke="blue" d="M-50 50L150 50"/>'));
    check(paths[0][0].x === 0 && paths[0].at(-1).x === 1, 'Out-of-bed paths are clipped');
    paths = await convert(svg('<line x1="10" y1="50" x2="90" y2="50" stroke="black" stroke-width="2"/><rect x="40" y="30" width="20" height="40" fill="white"/>'));
    check(paths.length === 2 && paths.every(p => p.color === '#000000'), 'Stroke behind a white fill is split and the white fill adds no ink');
    check(paths.every(p => p.color !== '#08b1dc'), 'White fill is paper: it never hatches sky blue');
    check(paths.every(p => p.every(pt => !(pt.x > 0.4 && pt.x < 0.6 && Math.abs(pt.y - 0.5) < 0.02))), 'Stroke behind an opaque white fill is hidden');
    paths = await convert(svg('<line x1="10" y1="50" x2="90" y2="50" stroke="black" stroke-width="2"/><rect x="40" y="30" width="20" height="40" fill="red"/>'));
    check(paths.some(p => p.color === '#ff0000'), 'Opaque colored fill still hatches');
    check(paths.filter(p => p.color === '#000000').every(p => p.every(pt => !(pt.x > 0.4 && pt.x < 0.6 && Math.abs(pt.y - 0.5) < 0.02))), 'Stroke behind an opaque colored fill is hidden');
    paths = await convert(svg('<line x1="10" y1="10" x2="90" y2="10" stroke="black" stroke-width="2"/>'));
    check(paths.length === 1, 'A stroke with no fill above it is unchanged');
    for (const [body, label] of [
      ['<text x="0" y="20">Hi</text>', 'Unsupported text reports an error'],
      ['<defs><linearGradient id="g"><stop stop-color="red"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/>', 'Unsupported gradients report an error'],
      ['<path fill="none" stroke="red" stroke-dasharray="2 2" d="M0 0L100 100"/>', 'Dashed paths report an error']
    ]) {
      let rejected = false;
      try { await convert(svg(body)); } catch { rejected = true; }
      check(rejected, label);
    }
    paths = await convert(svg('<script>parent.hacked=true<\/script><path onload="parent.hacked=true" stroke="red" fill="none" d="M0 0L100 100"/>'));
    check(!w.hacked && !w.document.querySelector('iframe'), 'Imported script and event attributes never execute; temporary frame is removed');
    evaluate(`state.strokes = ['#e53935','#e53935','#3367d6','#ff0000'].map((color,i) => Object.assign([{x:.1,y:.1+i*.15},{x:.8,y:.1+i*.15}], {color,shape:true}));`);
    const originalStrokes = evaluate('JSON.stringify(serializeStrokes(state.strokes))');
    let gcode = w.generateGcode();
    const jobEnd = evaluate('`T-1\\nG0 X0 Y${formatMm(dimensions().height)} F${Math.round(feeds().travel)}\\nM84\\n; End of Color Plotter job\\n`');
    check(gcode.endsWith(jobEnd) && gcode.match(/^T-1$/gm)?.length === 1, 'Job unmounts the pen once, parks top-left, and disables motors (no homing at the end)');
    check(JSON.stringify(gcode.match(/^T\d+/gm)) === JSON.stringify(['T1','T6']), 'Interleaved colors sharing a marker plot in one pass per tool');
    // Travels follow the strokes in [0,1,3,2] order, entering each stroke
    // from whichever end faces the pen (stroke 1 is reversed: the pen
    // reaches its far end first), and the job ends with the top-left park
    // move, which is also a G0 line. A tool change resets the pen position
    // (stroke 2 is entered from its start, not its nearer end). The old
    // expectation assumed every stroke was entered from its start; that
    // predates both the reversal and the park move.
    const expectedTravels = evaluate("(function () { var order = [0, 1, 3, 2]; var pen = null; var tool = null; var travels = order.map(function (i) { var s = state.strokes[i]; var t = toolForStroke(s); if (t !== tool) { tool = t; pen = null; } var a = plotPoint(s[0]), b = plotPoint(s[s.length - 1]); var entry = !pen || distance(pen, a) <= distance(pen, b) ? a : b; pen = entry === a ? b : a; return 'G0 X' + formatMm(entry.x) + ' Y' + formatMm(entry.y) + ' F' + Math.round(feeds().travel); }); travels.push('G0 X0 Y' + formatMm(dimensions().height) + ' F' + Math.round(feeds().travel)); return travels; })()");
    check(JSON.stringify(gcode.match(/^G0 .*$/gm)) === JSON.stringify(expectedTravels), 'Grouping retains every path in its original order within each marker, entering each from its nearer end, then parks');
    check(evaluate('JSON.stringify(serializeStrokes(state.strokes))') === originalStrokes, 'Generating grouped G-code preserves canvas strokes and their order');
    const lift = evaluate('(function(){var l=[]; penUp(l); return l.join("\\n");})()');
    check(gcode.includes(lift + '\nM400 ; finish moves before changing marker\nT6 ; marker #2d4e9e\n' + lift), 'Tool change waits for moves and lifts pen before and after selection');
    check(evaluate('serializeStrokes(deserializeStrokes(serializeStrokes(state.strokes)))[0].color') === '#e53935', 'Color survives gallery serialization round trip');
    check(evaluate('cloneStrokes(state.strokes)[0].color') === '#e53935', 'Undo clones retain stroke color');
    check(evaluate('eraseStrokeAt(state.strokes[0], {x:.4,y:.1}).every(piece => piece.color === "#e53935")'), 'Eraser fragments retain color');
    evaluate('state.strokes = [[{x:0,y:0},{x:1,y:1}]]');
    check(/^T0\b/m.test(w.generateGcode()), 'Legacy monochrome drawings use T0');
    check(w.generateGcode().endsWith(jobEnd), 'Monochrome jobs also unmount, park top-left, and disable motors');
    w.document.querySelector('[data-marker="6"]').click();
    check(w.document.querySelector('[data-marker="6"]').getAttribute('aria-pressed') === 'true' && w.document.querySelector('[data-marker="0"]').getAttribute('aria-pressed') === 'false', 'Marker selection updates the UI');
    const premade = w.parsePremadeGcode('T1\nG0 X0 Y0\nG1 X10 Y10\nT6\nG0 X10 Y0\nG1 X0 Y10');
    check(premade.length === 2 && premade[0].color === '#e42e2a' && premade[1].color === '#2d4e9e', 'Premade G-code tool changes preserve marker colors');
    const fileInput = w.document.querySelector('#svgFile');
    // Imports are additive now, so the pane starts empty here to keep
    // the path count below about the import itself, not the leftover
    // monochrome stroke from the previous check.
    evaluate('state.strokes = []; render(); updateUi();');
    const transfer = new w.DataTransfer();
    transfer.items.add(new w.File([svg('<path fill="none" stroke="red" d="M10 10L90 90"/><rect x="70" y="10" width="1" height="80" fill="blue"/>')], 'two-colors.svg', {type:'image/svg+xml'}));
    fileInput.files = transfer.files;
    await new Promise((resolve, reject) => {
      const observer = new w.MutationObserver(() => {
        if (!w.document.querySelector('#importSvgButton').disabled) { observer.disconnect(); resolve(); }
      });
      // The import status line is now #importProgress (it used to be
      // #svgImportStatus); the button re-enables in the import's finally.
      observer.observe(w.document.querySelector('#importProgress'), {childList:true,subtree:true,attributes:true});
      fileInput.dispatchEvent(new w.Event('change', {bubbles:true}));
    });
    // 4 paths, not 3: the blue rect occludes the red diagonal, splitting it
    // into two visible pieces, plus the blue fill's own hatch and perimeter
    // (a 1-unit bar is wide enough to hatch now, not a traced centreline).
    check(evaluate('state.strokes.length') === 4 && evaluate('new Set(state.strokes.map(toolForStroke)).size') === 2, 'File upload retains thin SVG fills and opens an editable preview with two markers');
    check(JSON.stringify(w.generateGcode().match(/^T\d+/gm)) === JSON.stringify(['T1','T6']), 'File import produces the expected marker changes');
    check(w.document.querySelector('#viewDraw').classList.contains('hidden') === false, 'Successful SVG import opens drawing view');
    // Collage: a second import lands on top instead of clearing the pane.
    const firstCount = evaluate('state.strokes.length');
    const firstStrokes = evaluate('JSON.stringify(state.strokes)');
    await w.importSvgText(svg('<rect x="10" y="10" width="80" height="80" fill="none" stroke="green"/>'), 'second.svg', { additive: true });
    check(evaluate('state.strokes.length') > firstCount, 'Second SVG import adds on top instead of clearing the pane');
    check(evaluate('JSON.stringify(state.strokes.slice(0, ' + firstCount + '))') === firstStrokes, 'Second import leaves the first import untouched');
    check(evaluate('state.strokes.slice(' + firstCount + ').every(s => typeof s.group === "string")'), 'Imported strokes carry one shared group id');
    check(evaluate('state.drawingTool') === 'select' && evaluate('state.selection.length') > 0, 'New import is selected with the select tool');
    const addedGroup = evaluate('state.strokes[state.strokes.length - 1].group');
    const addedBox = evaluate('groupBBox(state.selection)');
    check(addedBox.maxX - addedBox.minX > 0.99 && addedBox.maxY - addedBox.minY > 0.99, 'Every import lands full-bed, stacked on top of the last');
    // A full-bed import has no room to move, so shrink it first: corner
    // resize scales the import about the opposite corner.
    w.beginSelectDrag({ x: addedBox.maxX, y: addedBox.maxY }, 'se');
    w.updateSelectDrag({ x: addedBox.maxX - 0.2, y: addedBox.maxY - 0.2 });
    w.endSelectDrag();
    const resizedBox = evaluate('groupBBox(state.selection)');
    check(Math.abs(resizedBox.maxX - 0.8) < 0.01 && Math.abs(resizedBox.maxY - 0.8) < 0.01 && Math.abs(resizedBox.minX - addedBox.minX) < 0.001, 'Corner resize scales the import about the opposite corner');
    // Select drag moves the whole import by the pointer delta and leaves
    // the first import untouched.
    const beforeMove = JSON.parse(evaluate('JSON.stringify(state.selection[0])'));
    const beforeFirst = evaluate('JSON.stringify(state.strokes[0])');
    w.beginSelectDrag({ x: 0.4, y: 0.4 }, null);
    w.updateSelectDrag({ x: 0.5, y: 0.45 });
    w.endSelectDrag();
    const moved = JSON.parse(evaluate('JSON.stringify(state.selection[0])'));
    check(Math.abs(moved[0].x - beforeMove[0].x - 0.1) < 0.001 && Math.abs(moved[0].y - beforeMove[0].y - 0.05) < 0.001, 'Select drag moves the whole import by the pointer delta');
    check(evaluate('JSON.stringify(state.strokes[0])') === beforeFirst, 'Moving one import leaves the other import untouched');
    // Undo restores the pre-move position, from a deep snapshot.
    w.undo();
    const undoneBox = evaluate('groupBBox(state.strokes.filter(s => s.group === "' + addedGroup + '"))');
    check(Math.abs(undoneBox.minX - resizedBox.minX) < 0.001 && Math.abs(undoneBox.maxX - resizedBox.maxX) < 0.001 && Math.abs(undoneBox.maxY - resizedBox.maxY) < 0.001, 'Undo restores the import after a move');
    // Off the page is allowed as long as part of it is on the page.
    evaluate('setDrawingTool("select")');
    evaluate('selectStrokes(state.strokes.filter(s => s.group === "' + addedGroup + '"))');
    w.beginSelectDrag({ x: 0.4, y: 0.4 }, null);
    w.updateSelectDrag({ x: 1.2, y: 0.4 });
    w.endSelectDrag();
    const offBedBox = evaluate('groupBBox(state.selection)');
    check(offBedBox.minX > 0.7 && offBedBox.maxX > 1 && offBedBox.minX < 1, 'A move can hang a group off the bed as long as part of it stays on');
    w.beginSelectDrag({ x: offBedBox.maxX, y: offBedBox.maxY }, 'se');
    w.updateSelectDrag({ x: offBedBox.maxX + 0.3, y: offBedBox.maxY + 0.1 });
    w.endSelectDrag();
    const grownBox = evaluate('groupBBox(state.selection)');
    check(grownBox.maxX > offBedBox.maxX && grownBox.minX < 1, 'A resize can grow a group off the bed as long as part of it stays on');
    const offBedGcode = w.generateGcode();
    const xs = [...offBedGcode.matchAll(/X(-?[\d.]+)/g)].map(m => Number(m[1]));
    const ys = [...offBedGcode.matchAll(/Y(-?[\d.]+)/g)].map(m => Number(m[1]));
    check(xs.length > 0 && xs.every(x => x >= 0 && x <= 118) && ys.every(y => y >= 0 && y <= 118), 'Off-bed parts are cropped from G-code instead of plotted');
    // Delete removes the selected import only.
    evaluate('setDrawingTool("select")');
    evaluate('selectStrokes(state.strokes.filter(s => s.group === state.strokes[state.strokes.length - 1].group))');
    const countBeforeDelete = evaluate('state.strokes.length');
    w.deleteSelection();
    check(evaluate('state.strokes.length') < countBeforeDelete && evaluate('state.strokes.length') === firstCount, 'Delete removes the selected import only');
    // Selection only grabs imported SVG paths: a freehand stroke on top
    // of an import is skipped, and clicking it selects nothing.
    evaluate('state.strokes = state.strokes.concat([[{x:0.5,y:0.5},{x:0.6,y:0.5}]]); render();');
    check(evaluate('selectableStrokeAt({x:0.55,y:0.5})') === null, 'Freehand strokes are not selectable');
    check(evaluate('selectableStrokeAt({x:0.5,y:0.5})') !== null, 'Imported SVG paths are selectable through a freehand stroke on top');
    w.showView('draw');
    const complexSvg = await (await fetch('fixtures/complex-fill.svg')).text();
    w.testFillStrokes = await convert(complexSvg);
    evaluate('state.strokes = window.testFillStrokes; render(); updateUi();');
    check(evaluate('new Set(state.strokes.map(toolForStroke)).size') === 3, 'Complex filled SVG imports strokes in all three colors');
    const filledGcode = w.generateGcode();
    check(filledGcode.includes('T1') && filledGcode.includes('T6') && filledGcode.includes('T4'), 'Complex imported fills generate G-code for all colors');
    // Pen preview thickness is a persisted setting, default 1.35 px.
    check(evaluate('previewStrokeWidthPx()') === 1.35, 'Pen preview defaults to 1.35 px');
    evaluate('document.querySelector("#previewStrokeWidth").value = "3"; document.querySelector("#previewStrokeWidth").dispatchEvent(new Event("input", {bubbles:true}))');
    check(evaluate('previewStrokeWidthPx()') === 3, 'Pen preview thickness setting changes the preview');
    check(w.document.querySelector('#previewStrokeWidthValue').textContent === '3 px', 'Pen preview thickness label follows the slider');
    check(JSON.parse(w.localStorage.getItem('colorPlotter.settings.v1')).previewStrokeWidth === '3', 'Pen preview thickness persists in settings');
    w.document.querySelector('#drawingAreaReset').click();
    check(evaluate('previewStrokeWidthPx()') === 1.35, 'Drawing area reset restores the 1.35 px preview');
    const sample = new URLSearchParams(location.search).get('sample');
    if (sample) {
      w.testFillStrokes = await convert(await (await fetch(sample)).text());
      evaluate('state.strokes = window.testFillStrokes; render(); updateUi();');
      check(w.generateGcode().includes('T-1'), 'Sample SVG imports and generates a complete plot job');
    }
    // A stroke clipped by a later opaque fill comes back as pieces that
    // share a split id, so the job lifts instead of linking across the fill.
    paths = await convert(svg('<path d="M0 50H100" stroke="red" fill="none"/><rect x="45" y="0" width="10" height="100" fill="blue"/>'));
    const redPieces = paths.filter((p) => p.color === '#ff0000');
    check(redPieces.length === 2 && redPieces[0].splitIds && redPieces[0].splitIds[0] === redPieces[1].splitIds[0], 'A stroke clipped by a later fill comes back as pieces sharing a split id');
    // Two same-colour strokes that touch still link without lifting; the
    // same pair sharing a split id lifts instead; a tool change never links.
    const touchPair = (withSplit, secondColor) => evaluate(`(function () {
      const a = Object.assign([{x:.1,y:.5},{x:.2,y:.5}], {color:'#e42e2a', shape:true});
      const b = Object.assign([{x:.205,y:.5},{x:.3,y:.5}], {color:'${secondColor}', shape:true});
      if (${withSplit}) { a.splitIds = ['hlr-1']; b.splitIds = ['hlr-1']; }
      state.strokes = [a, b]; return generateGcode();
    })()`);
    check(touchPair(false, '#e42e2a').includes('(connected)'), 'Two same-colour strokes that touch still link without lifting');
    check(!touchPair(true, '#e42e2a').includes('(connected)'), 'Pieces split from one line lift instead of linking across the gap');
    check(!touchPair(false, '#2d4e9e').includes('(connected)'), 'A tool change never links across colours');
    // Eraser fragments share a split id too: the erased gap stays empty.
    const erased = evaluate(`eraseStrokeAt(Object.assign([{x:.1,y:.1},{x:.8,y:.1}], {color:'#e42e2a', shape:true}), {x:.4,y:.1})`);
    check(erased.length === 2 && erased[0].splitIds && erased[0].splitIds[0] === erased[1].splitIds[0], 'Eraser fragments share a split id');
    evaluate(`state.strokes = [Object.assign([{x:.1,y:.5},{x:.2,y:.5}], {color:'#e42e2a', shape:true, splitIds:['hlr-1']}), Object.assign([{x:.205,y:.5},{x:.3,y:.5}], {color:'#e42e2a', shape:true, splitIds:['hlr-1']})];`);
    check(evaluate(`deserializeStrokes(serializeStrokes(state.strokes))[0].splitIds[0]`) === 'hlr-1', 'Split ids survive gallery serialization round trip');
    // Photo to sketch runs fully in the browser: the converter takes
    // pixels and returns the same stroke SVG the server used to.
    const photoResult = await evaluate(`(async () => {
      const c = document.createElement('canvas'); c.width = 120; c.height = 90;
      const x = c.getContext('2d');
      // Full-frame gradient with a black disc: enough tone area that
      // higher density packs strictly more ink (a thin strip alone
      // saturates the flow's occupancy grid at density 1).
      const g = x.createLinearGradient(0, 0, 120, 0);
      g.addColorStop(0, '#000'); g.addColorStop(1, '#fff');
      x.fillStyle = g; x.fillRect(0, 0, 120, 90);
      x.fillStyle = '#000'; x.beginPath(); x.arc(60, 45, 25, 0, 7); x.fill();
      const px = x.getImageData(0, 0, 120, 90);
      const d1 = await PhotoSketch.convertPixels(px, { shading: 'off', density: 1 });
      const d5 = await PhotoSketch.convertPixels(px, { shading: 'off', density: 5 });
      const tsp = await PhotoSketch.convertPixels(px, { shading: 'tsp', density: 1 });
      const blank = document.createElement('canvas'); blank.width = 40; blank.height = 30;
      const bx = blank.getContext('2d'); bx.fillStyle = '#fff'; bx.fillRect(0, 0, 40, 30);
      const w0 = await PhotoSketch.convertPixels(bx.getImageData(0, 0, 40, 30), { shading: 'off' });
      return { d1: { svg: d1.svg, stats: d1.stats }, d5: d5.stats, tsp: tsp.stats, w0: w0.stats };
    })()`);
    check(photoResult.d1.svg.includes('viewBox="0 0 480 480"'), 'In-browser photo conversion returns a 480 viewBox SVG');
    check(photoResult.d1.stats.structurePaths > 0 && photoResult.d1.stats.tonePaths > 0, 'In-browser photo conversion finds structure and tone');
    check(photoResult.d5.toneM > photoResult.d1.stats.toneM, 'In-browser density 5 packs more tone ink than density 1');
    check(photoResult.tsp.tonePaths === 1 + photoResult.tsp.colourLayers.length, 'In-browser TSP mode draws one tour per pen');
    check(photoResult.w0.tonePaths === 0 && photoResult.w0.structurePaths === 0, 'A blank white photo converts to nothing in the browser');
    const photoStrokes = await convert(photoResult.d1.svg);
    check(photoStrokes.length > 0 && photoStrokes.every((s) => s.every((pt) => pt.x >= 0 && pt.x <= 1 && pt.y >= 0 && pt.y <= 1)), 'Converted photo SVG imports through the normal path');
    // The Convert button drives the whole flow without a network call:
    // fetch is stubbed to reject, and the photo still lands as strokes.
    await evaluate(`(async () => {
      const c = document.createElement('canvas'); c.width = 120; c.height = 90;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 120, 0);
      g.addColorStop(0, '#000'); g.addColorStop(1, '#fff');
      x.fillStyle = g; x.fillRect(0, 0, 120, 90);
      x.fillStyle = '#000'; x.beginPath(); x.arc(60, 45, 25, 0, 7); x.fill();
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      const dt = new DataTransfer();
      dt.items.add(new File([blob], 'test.png', { type: 'image/png' }));
      document.querySelector('#photoFile').files = dt.files;
      window.__origFetch = window.fetch;
      window.fetch = () => Promise.reject(new Error('fetch during photo conversion'));
      document.querySelector('#photoConvert').click();
    })()`);
    for (let i = 0; i < 60; i++) {
      await new Promise((r) => setTimeout(r, 250));
      if (evaluate('document.querySelector("#importProgress").classList.contains("hidden")')) break;
    }
    check(evaluate('state.premadeSource') === 'test sketch' && evaluate('state.strokes.length') > 0, 'Convert button converts a photo into strokes with no server call');
    evaluate('window.fetch = window.__origFetch');
    delete w.testFillStrokes;
    output.textContent = results.join('\n');
    document.body.dataset.testResult = 'passed';
  } catch (error) {
    output.textContent = results.join('\n') + '\nFAIL ' + error.stack;
    document.body.dataset.testResult = 'failed';
  }
};
</script>
