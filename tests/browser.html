<!doctype html>
<meta charset="utf-8">
<title>Color plotter browser checks</title>
<style>body{margin:0}iframe{width:100%;height:1100px;border:0}pre{white-space:pre-wrap;padding:16px;background:#eff8ef}</style>
<pre id="results">Running…</pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const output = document.querySelector('#results');
const results = [];
if (new URLSearchParams(location.search).has('preview')) { output.style.display = 'none'; document.querySelector('#app').style.height = '1400px'; }
function check(condition, message) { if (!condition) throw new Error(message); results.push('PASS ' + message); }
document.querySelector('#app').onload = async ({ target }) => {
  const w = target.contentWindow;
  const evaluate = (code) => w.eval(code);
  const svg = (body, attributes = '') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ${attributes}>${body}</svg>`;
  const convert = (text) => w.PlotterColor.importSvg(text, w.svgFillStrokes);
  try {
    check(w.document.querySelectorAll('.marker-select').length === 8, 'Eight marker controls initialize');
    check(w.PlotterColor.nearestTool('#ee3030', w.PlotterColor.DEFAULT_PALETTE) === 1, 'Near-red maps to red marker');
    let paths = await convert(svg('<g transform="translate(10 20) scale(.5)" fill="none" stroke="red"><path d="M0 0 L100 100"/></g>'));
    check(paths.length === 1 && paths[0].color === '#ff0000', 'Inherited SVG stroke color is retained');
    check(Math.abs(paths[0][0].x - .1) < .001 && Math.abs(paths[0][0].y - .2) < .001 && Math.abs(paths[0].at(-1).x - .6) < .001, 'Nested SVG transforms preserve position');
    paths = await convert(svg('<path fill="none" stroke="blue" d="M0 0L10 0 m40 50 l10 0"/>'));
    check(paths.length === 2 && paths[1][0].x === .5, 'Relative compound subpaths stay separate');
    paths = await convert(svg('<path fill="red" fill-rule="evenodd" d="M0 0H100V100H0Z M25 25H75V75H25Z"/>'));
    check(paths.length > 0 && paths.every(p => p.color === '#ff0000'), 'Solid fills create colored hatch paths');
    check(paths.every(path => path.slice(1).every((b, i) => {
      const a = path[i], steps = Math.max(1, Math.ceil(Math.hypot(b.x-a.x, b.y-a.y)*960));
      for (let j = 0; j <= steps; j++) {
        const x = a.x+(b.x-a.x)*j/steps, y = a.y+(b.y-a.y)*j/steps;
        if (x > .251 && x < .749 && y > .251 && y < .749) return false;
      }
      return true;
    })), 'Even-odd fill holes remain empty along every hatch and connector');
    paths = await convert(svg('<path fill="red" d="M10 10H11V90H10Z"/>'));
    check(paths.length === 1 && paths[0].length > 1, 'Thin fill-only SVG artwork imports instead of being discarded');
    check(paths[0].every(p => p.x >= .1 && p.x <= .11), 'Thin fill routing stays inside the shape');
    paths = await convert('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480"><path fill="black" fill-rule="evenodd" d="M50 50H250V250H50Z M53 53H247V247H53Z"/></svg>');
    check(paths.length === 1 && paths[0].length < 20, 'Traced filled outlines become one compact centerline loop');
    const outlineLength = paths[0].slice(1).reduce((sum,p,i) => sum + Math.hypot(p.x-paths[0][i].x,p.y-paths[0][i].y)*480,0);
    check(outlineLength > 740 && outlineLength < 830, 'Traced outline is drawn once without hatch oscillations or duplicated contours');
    paths = await convert(svg('<rect x="10" y="10" width="20" height="20" fill="red"/><rect x="70" y="70" width="20" height="20" fill="blue"/>'));
    check(paths.length === 2 && paths.every(p => p.shape), 'Separate colored fill regions import as continuous paths');
    paths = await convert(svg('<style>.ink{stroke:#00a7b5;fill:none}</style><circle class="ink" cx="50" cy="50" r="20"/><g display="none"><path stroke="red" d="M0 0L50 50"/></g>'));
    check(paths.length === 1 && paths[0].color === '#00a7b5', 'CSS colors work and hidden shapes are skipped');
    paths = await convert('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><path stroke="red" d="M0 0L200 100" fill="none"/></svg>');
    check(Math.abs(paths[0][0].y-.25)<.001 && Math.abs(paths[0].at(-1).y-.75)<.001, 'SVG without viewBox fits and centers with its aspect ratio');
    paths = await convert(svg('<path fill="none" stroke="blue" d="M-50 50L150 50"/>'));
    check(paths[0][0].x === 0 && paths[0].at(-1).x === 1, 'Out-of-bed paths are clipped');
    for (const [body, label] of [
      ['<text x="0" y="20">Hi</text>', 'Unsupported text reports an error'],
      ['<defs><linearGradient id="g"><stop stop-color="red"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/>', 'Unsupported gradients report an error'],
      ['<path fill="none" stroke="red" stroke-dasharray="2 2" d="M0 0L100 100"/>', 'Dashed paths report an error']
    ]) {
      let rejected = false;
      try { await convert(svg(body)); } catch { rejected = true; }
      check(rejected, label);
    }
    paths = await convert(svg('<script>parent.hacked=true<\/script><path onload="parent.hacked=true" stroke="red" fill="none" d="M0 0L100 100"/>'));
    check(!w.hacked && !w.document.querySelector('iframe'), 'Imported script and event attributes never execute; temporary frame is removed');
    evaluate(`state.strokes = ['#e53935','#e53935','#3367d6','#ff0000'].map((color,i) => Object.assign([{x:.1,y:.1+i*.15},{x:.8,y:.1+i*.15}], {color,shape:true}));`);
    const originalStrokes = evaluate('JSON.stringify(serializeStrokes(state.strokes))');
    let gcode = w.generateGcode();
    check(gcode.endsWith('T-1\nG28\nM84\n; End of Small Plotter job\n') && gcode.match(/^T-1$/gm)?.length === 1, 'Job unmounts the pen once, then homes and disables motors');
    check(JSON.stringify(gcode.match(/^T\d+/gm)) === JSON.stringify(['T1','T6']), 'Interleaved colors sharing a marker plot in one pass per tool');
    const expectedTravels = evaluate('[0,1,3,2].map(i => { const p = plotPoint(state.strokes[i][0]); return `G0 X${formatMm(p.x)} Y${formatMm(p.y)} F${Math.round(feeds().travel)}`; })');
    check(JSON.stringify(gcode.match(/^G0 .*$/gm)) === JSON.stringify(expectedTravels), 'Grouping retains every path in its original order within each marker');
    check(evaluate('JSON.stringify(serializeStrokes(state.strokes))') === originalStrokes, 'Generating grouped G-code preserves canvas strokes and their order');
    const lift = evaluate('PEN_UP.join("\\n")');
    check(gcode.includes(lift + '\nM400 ; finish moves before changing marker\nT6 ; marker #3367d6\n' + lift), 'Tool change waits for moves and lifts pen before and after selection');
    check(evaluate('serializeStrokes(deserializeStrokes(serializeStrokes(state.strokes)))[0].color') === '#e53935', 'Color survives gallery serialization round trip');
    check(evaluate('cloneStrokes(state.strokes)[0].color') === '#e53935', 'Undo clones retain stroke color');
    check(evaluate('eraseStrokeAt(state.strokes[0], {x:.4,y:.1}).every(piece => piece.color === "#e53935")'), 'Eraser fragments retain color');
    evaluate('state.strokes = [[{x:0,y:0},{x:1,y:1}]]');
    check(/^T0\b/m.test(w.generateGcode()), 'Legacy monochrome drawings use T0');
    check(w.generateGcode().endsWith('T-1\nG28\nM84\n; End of Small Plotter job\n'), 'Monochrome jobs also unmount before homing and disabling motors');
    w.document.querySelector('[data-marker="6"]').click();
    check(w.document.querySelector('#activeMarkerLabel').textContent === 'Drawing with T6', 'Marker selection updates the UI');
    const premade = w.parsePremadeGcode('T1\nG0 X0 Y0\nG1 X10 Y10\nT6\nG0 X10 Y0\nG1 X0 Y10');
    check(premade.length === 2 && premade[0].color === '#e53935' && premade[1].color === '#3367d6', 'Premade G-code tool changes preserve marker colors');
    const fileInput = w.document.querySelector('#svgFile');
    const transfer = new w.DataTransfer();
    transfer.items.add(new w.File([svg('<path fill="none" stroke="red" d="M10 10L90 90"/><rect x="70" y="10" width="1" height="80" fill="blue"/>')], 'two-colors.svg', {type:'image/svg+xml'}));
    fileInput.files = transfer.files;
    await new Promise((resolve, reject) => {
      const status = w.document.querySelector('#svgImportStatus');
      const observer = new w.MutationObserver(() => {
        if (!w.document.querySelector('#importSvgButton').disabled) { observer.disconnect(); resolve(); }
      });
      observer.observe(status, {childList:true,subtree:true});
      fileInput.dispatchEvent(new w.Event('change', {bubbles:true}));
    });
    check(evaluate('state.strokes.length') === 2 && w.document.querySelector('#svgImportStatus').textContent.includes('2 markers'), 'File upload retains thin SVG fills and opens an editable preview with two markers');
    check(JSON.stringify(w.generateGcode().match(/^T\d+/gm)) === JSON.stringify(['T1','T6']), 'File import produces the expected marker changes');
    check(w.document.querySelector('#viewDraw').classList.contains('hidden') === false, 'Successful SVG import opens drawing view');
    w.showView('draw');
    const complexSvg = await (await fetch('fixtures/complex-fill.svg')).text();
    w.testFillStrokes = await convert(complexSvg);
    evaluate('state.strokes = window.testFillStrokes; render(); updateUi();');
    check(w.document.querySelectorAll('.color-assignment').length === 3, 'Complex filled SVG displays all three color assignments');
    const filledGcode = w.generateGcode();
    check(filledGcode.includes('T1') && filledGcode.includes('T6') && filledGcode.includes('T4'), 'Complex imported fills generate G-code for all colors');
    const sample = new URLSearchParams(location.search).get('sample');
    if (sample) {
      w.testFillStrokes = await convert(await (await fetch(sample)).text());
      evaluate('state.strokes = window.testFillStrokes; render(); updateUi();');
      check(w.generateGcode().includes('T-1'), 'Sample SVG imports and generates a complete plot job');
    }
    delete w.testFillStrokes;
    output.textContent = results.join('\n');
    document.body.dataset.testResult = 'passed';
  } catch (error) {
    output.textContent = results.join('\n') + '\nFAIL ' + error.stack;
    document.body.dataset.testResult = 'failed';
  }
};
</script>
